[project]
name = "skynemos"
version = "0.1.0"
description = "Telegram-бот «Скинемось»: щомісячні збори за спільні підписки та витрати"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    # zoneinfo на Windows не має бази часових поясів, tzdata її додає
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
]
# Опційно: FSM-стан у Redis (переживає перезапуск бота)
redis = ["redis>=5.0"]
# Опційно: звіти про помилки в Sentry
sentry = ["sentry-sdk>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Кирилиця в текстах і коментарях навмисна, а не «схожі на латиницю» символи
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["bot"]
strict = true
warn_unreachable = true
# Бібліотеки без type hints
[[tool.mypy.overrides]]
module = ["apscheduler.*", "sentry_sdk.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["bot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
